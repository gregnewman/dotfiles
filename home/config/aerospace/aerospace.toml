# Place a copy of this config to ~/.aerospace.toml
# After that, you can edit ~/.aerospace.toml to your liking

# It's not necessary to copy all keys to your config.
# If the key is missing in your config, "default-config.toml" will serve as a fallback

# You can use it to add commands that run after login to macOS user session.
# 'start-at-login' needs to be 'true' for 'after-login-command' to work
# Available commands: https://nikitabobko.github.io/AeroSpace/commands
config-version = 2

after-login-command = []

# You can use it to add commands that run after AeroSpace startup.
# 'after-startup-command' is run after 'after-login-command'
# Available commands : https://nikitabobko.github.io/AeroSpace/commands
after-startup-command = []

exec-on-workspace-change = ['/opt/homebrew/bin/sketchybar', '--trigger', 'aerospace_workspace_change', 'FOCUSED=%{focused-workspace}']

# Start AeroSpace at login
start-at-login = true

# Normalizations. See: https://nikitabobko.github.io/AeroSpace/guide#normalization
enable-normalization-flatten-containers = true
enable-normalization-opposite-orientation-for-nested-containers = true

# See: https://nikitabobko.github.io/AeroSpace/guide#layouts
# The 'accordion-padding' specifies the size of accordion padding
# You can set 0 to disable the padding feature
accordion-padding = 100

# Possible values: tiles|accordion
default-root-container-layout = 'tiles'

# Possible values: horizontal|vertical|auto
# 'auto' means: wide monitor (anything wider than high) gets horizontal orientation,
#               tall monitor (anything higher than wide) gets vertical orientation
default-root-container-orientation = 'auto'

# Possible values: (qwerty|dvorak)
# See https://nikitabobko.github.io/AeroSpace/guide#key-mapping
key-mapping.preset = 'qwerty'

# Mouse follows focus when focused monitor changes
# Drop it from your config, if you don't like this behavior
# See https://nikitabobko.github.io/AeroSpace/guide#on-focus-changed-callbacks
# See https://nikitabobko.github.io/AeroSpace/commands#move-mouse
# on-focused-monitor-changed = ['move-mouse monitor-lazy-center']

# Gaps between windows (inner-*) and between monitor edges (outer-*).
# Possible values:
# - Constant:     gaps.outer.top = 8
# - Per monitor:  gaps.outer.top = [{ monitor.main = 16 }, { monitor."some-pattern" = 32 }, 24]
#                 In this example, 24 is a default value when there is no match.
#                 Monitor pattern is the same as for 'workspace-to-monitor-force-assignment'.
#                 See: https://nikitabobko.github.io/AeroSpace/guide#assign-workspaces-to-monitors
persistent-workspaces = ['1', '2', '3', '4', '5', '6', '7', '8', '9', '0', 'O']

[gaps]
inner.horizontal = 5
inner.vertical =   5
outer.left =       5
outer.bottom =     48
outer.top =        5
outer.right =      5

# 'main' binding mode declaration
# See: https://nikitabobko.github.io/AeroSpace/guide#binding-modes
# 'main' binding mode must be always presented
[mode.main.binding]

# All possible keys:
# - Letters.        a, b, c, ..., z
# - Numbers.        0, 1, 2, ..., 9
# - Keypad numbers. keypad0, keypad1, keypad2, ..., keypad9
# - F-keys.         f1, f2, ..., f20
# - Special keys.   minus, equal, period, comma, slash, backslash, quote, semicolon, backtick,
#                   leftSquareBracket, rightSquareBracket, space, enter, esc, backspace, tab
# - Keypad special. keypadClear, keypadDecimalMark, keypadDivide, keypadEnter, keypadEqual,
#                   keypadMinus, keypadMultiply, keypadPlus
# - Arrows.         left, down, up, right

# All possible modifiers: cmd, alt, ctrl, shift

# All possible commands: https://nikitabobko.github.io/AeroSpace/commands

# See: https://nikitabobko.github.io/AeroSpace/commands#layout
# All bindings use cmd-ctrl so alt stays free for Emacs Meta and the terminal
cmd-ctrl-semicolon = 'layout tiles accordion'      # toggle tiles <-> accordion
cmd-ctrl-equal = 'layout horizontal vertical'      # flip orientation

# See: https://nikitabobko.github.io/AeroSpace/commands#focus
cmd-ctrl-h = 'focus left'
cmd-ctrl-j = 'focus down'
cmd-ctrl-k = 'focus up'
cmd-ctrl-l = 'focus right'

# See: https://nikitabobko.github.io/AeroSpace/commands#move
cmd-ctrl-shift-h = 'move left'
cmd-ctrl-shift-j = 'move down'
cmd-ctrl-shift-k = 'move up'
cmd-ctrl-shift-l = 'move right'

# See: https://nikitabobko.github.io/AeroSpace/commands#resize
cmd-ctrl-shift-minus = 'resize smart -50'
cmd-ctrl-shift-equal = 'resize smart +50'

# Workspaces
# See: https://nikitabobko.github.io/AeroSpace/commands#workspace
cmd-ctrl-1 = 'workspace 1'   # floating
cmd-ctrl-2 = 'workspace 2'   # floating
cmd-ctrl-3 = 'workspace 3'   # WezTerm
cmd-ctrl-4 = 'workspace 4'   # Emacs
cmd-ctrl-5 = 'workspace 5'   # Safari
cmd-ctrl-6 = 'workspace 6'   # Notes
cmd-ctrl-7 = 'workspace 7'   # Planning
cmd-ctrl-8 = 'workspace 8'   # Comms
cmd-ctrl-9 = 'workspace 9'   # Messages
cmd-ctrl-0 = 'workspace 0'   # Vivaldi
cmd-ctrl-o = 'workspace O'   # Dev (OrbStack, Linear)

# See: https://nikitabobko.github.io/AeroSpace/commands#move-node-to-workspace
cmd-ctrl-shift-1 = 'move-node-to-workspace 1'
cmd-ctrl-shift-2 = 'move-node-to-workspace 2'
cmd-ctrl-shift-3 = 'move-node-to-workspace 3'
cmd-ctrl-shift-4 = 'move-node-to-workspace 4'
cmd-ctrl-shift-5 = 'move-node-to-workspace 5'
cmd-ctrl-shift-6 = 'move-node-to-workspace 6'
cmd-ctrl-shift-7 = 'move-node-to-workspace 7'
cmd-ctrl-shift-8 = 'move-node-to-workspace 8'
cmd-ctrl-shift-9 = 'move-node-to-workspace 9'
cmd-ctrl-shift-0 = 'move-node-to-workspace 0'
cmd-ctrl-shift-o = 'move-node-to-workspace O'

cmd-ctrl-shift-f = 'fullscreen'

# See: https://nikitabobko.github.io/AeroSpace/commands#workspace-back-and-forth
cmd-ctrl-tab = 'workspace-back-and-forth'
# See: https://nikitabobko.github.io/AeroSpace/commands#move-workspace-to-monitor
cmd-ctrl-shift-tab = 'move-workspace-to-monitor --wrap-around next'

# See: https://nikitabobko.github.io/AeroSpace/commands#mode
cmd-ctrl-quote = 'mode service'

cmd-ctrl-shift-w = 'mode resize'

[mode.resize.binding]
h = 'resize width -50'
j = 'resize height +50'
k = 'resize height -50'
l = 'resize width +50'
b = 'balance-sizes'

# See: https://nikitabobko.github.io/AeroSpace/commands#resize
minus = 'resize smart -50'
equal = 'resize smart +50'

enter = 'mode main'
esc = 'mode main'

# 'service' binding mode declaration.
# See: https://nikitabobko.github.io/AeroSpace/guide#binding-modes
[mode.service.binding]
esc = ['reload-config', 'mode main']
r = ['flatten-workspace-tree', 'mode main'] # reset layout
#s = ['layout sticky tiling', 'mode main'] # sticky is not yet supported https://github.com/nikitabobko/AeroSpace/issues/2
f = ['layout floating tiling', 'mode main'] # Toggle between floating and tiling layout
backspace = ['close-all-windows-but-current', 'mode main']

cmd-ctrl-shift-h = ['join-with left', 'mode main']
cmd-ctrl-shift-j = ['join-with down', 'mode main']
cmd-ctrl-shift-k = ['join-with up', 'mode main']
cmd-ctrl-shift-l = ['join-with right', 'mode main']

[workspace-to-monitor-force-assignment]
3 = "LG ULTRAWIDE"               # WezTerm
4 = "LG ULTRAWIDE"               # Emacs
5 = "LG ULTRAWIDE"               # Safari
6 = "LG ULTRAWIDE"               # Notes
7 = "LG ULTRAWIDE"               # Planning
8 = "LG ULTRAWIDE"               # Comms
9 = "Built-in Retina Display"    # Messages/Slack — laptop screen
0 = "LG ULTRAWIDE"               # Vivaldi
O = "LG ULTRAWIDE"               # Dev

[[on-window-detected]]
    if.app-id = 'com.freron.MailMate'
    run = ['layout floating', 'move-node-to-workspace 8']

[[on-window-detected]]
    if.app-id = 'dev.kdrag0n.MacVirt'
    run = "move-node-to-workspace O"

[[on-window-detected]]
    if.app-id = 'com.linear'
    run = "move-node-to-workspace O"

[[on-window-detected]]
    if.app-id = 'org.gnu.Emacs'
    run = "move-node-to-workspace 4"

[[on-window-detected]]
    if.app-id = 'com.apple.Safari'
    run = "move-node-to-workspace 5"

[[on-window-detected]]
    if.app-id = 'us.zoom.xos'
    run = ['layout floating', 'move-node-to-workspace 9']   # laptop screen, stays visible while switching LG workspaces

[[on-window-detected]]
    if.app-id = 'com.github.wez.wezterm'
    run = "move-node-to-workspace 3"

[[on-window-detected]]
    if.app-id = 'md.obsidian'
    run = "move-node-to-workspace 6"

[[on-window-detected]]
    if.app-id = 'com.agiletortoise.Drafts-OSX'
    run = "move-node-to-workspace 6"

[[on-window-detected]]
    if.app-id = 'com.flexibits.fantastical2.mac'
    run = "move-node-to-workspace 7"

[[on-window-detected]]
    if.app-id = 'com.omnigroup.OmniFocus4'
    run = "move-node-to-workspace 7"

[[on-window-detected]]
    if.app-id = 'com.culturedcode.ThingsMac'
    run = "move-node-to-workspace 7"

[[on-window-detected]]
    if.app-id = 'com.apple.MobileSMS'
    run = "move-node-to-workspace 9"

[[on-window-detected]]
    if.app-id = 'com.tinyspeck.slackmacgap'
    run = "move-node-to-workspace 9"

[[on-window-detected]]
    if.app-id = 'com.vivaldi.Vivaldi'
    run = "move-node-to-workspace 0"

[[on-window-detected]]
    if.app-id = 'com.tapbots.Ivory'
    run = ['layout floating', 'move-node-to-workspace 1']

[[on-window-detected]]
    if.app-id = 'com.reederapp.5.macOS'
    run = ['layout floating', 'move-node-to-workspace 1']

[[on-window-detected]]
    if.app-id = 'com.toggl.daneel'
    run = ['layout floating', 'move-node-to-workspace 2']

[[on-window-detected]]
    if.app-id = 'com.fournova.Tower3'
    run = ['layout floating', 'move-node-to-workspace 2']

# Workspaces 1 and 2 are floating catch-all spaces
[[on-window-detected]]
    if.workspace = '1'
    run = ['layout floating']

[[on-window-detected]]
    if.workspace = '2'
    run = ['layout floating']
